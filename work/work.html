<!DOCTYPE html>

<head>

<body>
  <div class="header">
    <h1>Work</h1>
    <a href="..\index.html" class="back-btn">← Back to Home</a>
  </div>

  <div class="container">
    <div class="projects-grid" id="projectsGrid">
      <!-- Projects will be generated by JavaScript -->
    </div>
  </div>

  <!-- PROJECT MODAL -->
  <div class="modal" id="projectModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>

      <div class="modal-body">
        <div class="gallery-container">
          <div class="gallery-wrapper" id="modalGallery">
            <!-- Gallery items will be inserted here -->
          </div>
          <button class="gallery-arrow prev" id="prevBtn" onclick="prevSlide()">❮</button>
          <button class="gallery-arrow next" id="nextBtn" onclick="nextSlide()">❯</button>
          <div class="gallery-nav" id="modalNav">
            <!-- Dots will be inserted here -->
          </div>
        </div>

        <div class="project-info">
          <h2 id="modalTitle"></h2>
          <p id="modalDescription"></p>
          <div class="project-tags" id="modalTags"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="fullscreen-overlay" id="fullscreenOverlay">
    <img id="fullscreenImg" src="" alt="">
  </div>

  <script>
    // Project data -> to add more projects - add more objects to the projects array
    const projects = [
      {
        id: 1,

        description: "Aferdita is a character that I modelled, based on my own concept art. The whole 3D process was done in Blender; from modelling, texturing, rigging and rendering. My goal was to create a stylized character from scratch in order to experience the full 3D pipeline. Aferdita was made ready to be animated and implemented in a game engine.The 2D character concept for Aferdita, after which her 3D model was created. The concept art was made in Clip Studio Paint, under the guidance of my mentor Ruth Bosch.",
        thumbnail: "..\\pictures\\comgx.png",
        gallery: [
          "https://via.placeholder.com/1200x750?text=Project+1+-+Image+1",

          "https://via.placeholder.com/1200x750?text=Project+1+-+Image+3"
        ],
        tags: ["3D", "Blender", "Character Design"]
      },
      {
        id: 2,
        title: "Fourcast",
        category: "Game-ready 3D Character & Environment",
        description: "Fourcast is a cooperative puzzle game that I created as a bachelor project with 4 other students, in which players solve puzzles by casting spells together. I was the 3D lead artist and was responsible for modelling, texturing, rigging and animating the 3D characters and environments. I created and used both procedural systems as well as handcrafted techniques to create the assets.The game was awarded for its innovative gameplay and immersive art direction",
        thumbnail: "..\\pictures\\Fourcast3.png",
        gallery: [
          { type: "image", src: "..\\pictures\\Fourcast3.png" },
          "https://via.placeholder.com/1200x750?text=Project+2+-+Image+2",
          "https://via.placeholder.com/1200x750?text=Project+2+-+Image+3",
          "https://via.placeholder.com/1200x750?text=Project+2+-+Image+4"
        ],
        tags: ["3D", "Blender", "Unreal Engine", "Game Design"]
      },
      {
        id: 3,
        title: "Unnamed Robot - Project Babel",
        category: "Game-ready 3D Character",
        description: "Describe your third project here. Include any relevant details about the client, the brief, your approach, and the final deliverables.",
        thumbnail: "..\\pictures\\Skeleton.png",
        gallery: [
          { type: "image", src: "..\\pictures\\Skeleton.png" },
          { type: "image", src: "..\\pictures\\Skeleton.png" }
        ],
        tags: ["3D", "Blender", "Character Design"]
      },
      {
        id: 4,
        title: "PleasurePal 3000",
        category: "3D & Video Editing",
        description: "Together with my colleague Sebastian Borter, I worked on creating a fake 3D advertisement for the «PleasurePal 3000», inspired by the Fallout series. Sebastian used Blender for the 3D modeling and animation of the PleasurePal, whereas I created the last scene in Blender and edited the video in Premiere Pro and After Effects.",
        thumbnail: "..\\pictures\\PleasurePal.png",
        gallery: [
          { type: "embed", src: "https://player.vimeo.com/video/1216216312?badge=0&autopause=0&player_id=0&app_id=58479" },

          { type: "image", src: "..\\pictures\\Cityscape.png" }
        ],
        tags: ["3D", "Blender", "VFX"]
      },
      {
        id: 5,
        title: "DWARF",
        category: "Pixel Art Environment",
        description: "Project 5 details here. Explain your process and the creative decisions you made.",
        thumbnail: "..\\pictures\\comgx.png",
        gallery: [

          { type: "image", src: "..\\pictures\\Skeleton.png" }
        ],
        tags: ["2D", "Pixel Art", "Game Design"]
      },
      {
        id: 6,

        category: "Creative Coding",
        description: "Several browser extensions I created, which recontextualize the user's interaction with their web browser. The extensions are not \"useful\", but rather aim to create friction and inconvenience in order to make the user reflect on their browsing and working habits. The extensions are made with HTML, CSS and Javascript and can be downloaded on Github.",
        thumbnail: "..\\pictures\\browserext1.gif",
        gallery: [
          { type: "image", src: "..\\pictures\\Skeleton.png" },
          { type: "image", src: "..\\pictures\\Cityscape.png" }
        ],

      },
      {
        id: 7,
        title: "Trial Period",
        category: "Cooperative Web Experience",
        description: "What if being single were forbidden, and society transformed non-conformists into animals? Inspired by the film \"The Lobster,\" this web project, \"Trial Period,\" explores this concept. \"Trial Period\" examines whether one should stay in a relationship to meet social expectations or break free from these norms. It features a unique Two-Screen Experience, requiring users to navigate the website on two screens simultaneously to fully engage with the content, reflecting themes of relationships and love from the film. In this project, users become a newly matched couple undergoing a \"trial period.\" They start by choosing character traits and must match with their partner to proceed. Navigation is split: one user controls the horizontal axis, the other the vertical, enforcing communication and cooperation. Proximity impacts the experience, mimicking the dynamics of real and long-distance relationships.",
        thumbnail: "..\\pictures\\LobsterMock1.png",
        gallery: [
          { type: "image", src: "..\\pictures\\LobsterMock1.png" },

        ],
        tags: ["3D", "Blender", "Fan Art"]
      },
      {
        id: 8,
        title: "War Mage",
        category: "Character Concept & Modeling",
        description: "",
        thumbnail: "..\\pictures\\pixel_portrait.png",
        gallery: [
          { type: "image", src: "..\\pictures\\pixel_portrait.png" }
        ],
        tags: ["3D", "Blender", "Fan Art"]
      },
      {
        id: 9,
        title: "Loading...",
        category: "More projects coming soon!",
        description: "",
        thumbnail: "..\\pictures\\pixel_portrait.png",
        gallery: [
          { type: "image", src: "..\\pictures\\pixel_portrait.png" }
        ],
        tags: ["3D", "Blender", "Fan Art"]
      }
    ];

    let currentProject = null;
    let currentGalleryIndex = 0;

    // Generate grid
    function generateGrid() {
      const grid = document.getElementById('projectsGrid');
      grid.innerHTML = projects.map(project => `
        <div class="project-card" onclick="openProject(${project.id})">
          <img src="${project.thumbnail}" alt="${project.title}" class="project-image">
          <div class="project-overlay-info">
            <h3>${project.title}</h3>
            <p>${project.category}</p>
          </div>
        </div>
      `).join('');
    }

    // Open project modal
    function openProject(projectId) {
      currentProject = projects.find(p => p.id === projectId);
      currentGalleryIndex = 0;

      if (!currentProject) return;

      document.getElementById('modalTitle').textContent = currentProject.title;
      document.getElementById('modalDescription').textContent = currentProject.description;

      // Generate tags
      document.getElementById('modalTags').innerHTML = currentProject.tags
        .map(tag => `<div class="tag">${tag}</div>`)
        .join('');

      // Generate gallery
      const gallery = document.getElementById('modalGallery');
      gallery.innerHTML = currentProject.gallery
        .map(item => {
          if (item.type === 'image') {
            return `<div class="gallery-item"><img src="${item.src}" alt="Gallery image"></div>`;
          } else if (item.type === 'video') {
            return `<div class="gallery-item"><video controls><source src="${item.src}" type="video/mp4"></video></div>`;
          } else if (item.type === 'embed') {
            return `<div class="gallery-item"><div class="embed-wrapper"><iframe src="${item.src}" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></div>`;
          }
        })
        .join('');

      // Generate dots
      const nav = document.getElementById('modalNav');
      nav.innerHTML = currentProject.gallery
        .map((_, i) => `<div class="gallery-dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`)
        .join('');

      updateGallery();
      document.getElementById('projectModal').classList.add('active');
    }

    function openFullscreen(src, alt) {
      const overlay = document.getElementById('fullscreenOverlay');
      const overlayImg = document.getElementById('fullscreenImg');
      overlayImg.src = src;
      overlayImg.alt = alt || '';
      overlay.classList.add('active');
    }

    function closeFullscreen() {
      const overlay = document.getElementById('fullscreenOverlay');
      overlay.classList.remove('active');
      document.getElementById('fullscreenImg').src = '';
    }

    // Click/tap on any gallery image opens fullscreen
    document.getElementById('modalGallery').addEventListener('click', (e) => {
      if (e.target.tagName === 'IMG') {
        openFullscreen(e.target.src, e.target.alt);
      }
    });

    // Clicking anywhere on the overlay (image or backdrop) closes it
    document.getElementById('fullscreenOverlay').addEventListener('click', closeFullscreen);

    // Escape key closes it too
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeFullscreen();
    });

    // Close modal
    function closeModal() {
      document.getElementById('projectModal').classList.remove('active');
      currentProject = null;
      closeFullscreen();   // <-- replaces the old manual class-removal check
    }

      // Gallery navigation
      function nextSlide() {
        if (!currentProject) return;
        currentGalleryIndex = (currentGalleryIndex + 1) % currentProject.gallery.length;
        updateGallery();
      }

      function prevSlide() {
        if (!currentProject) return;
        currentGalleryIndex = (currentGalleryIndex - 1 + currentProject.gallery.length) % currentProject.gallery.length;
        updateGallery();
      }

      function goToSlide(index) {
        currentGalleryIndex = index;
        updateGallery();
      }

      function updateGallery() {
        const wrapper = document.getElementById('modalGallery');
        wrapper.style.transform = `translateX(${-currentGalleryIndex * 100}%)`;

        const dots = document.querySelectorAll('#modalNav .gallery-dot');
        dots.forEach((dot, i) => {
          dot.classList.toggle('active', i === currentGalleryIndex);
        });
      }

      // Touch/swipe support
      let touchStartX = 0;
      document.addEventListener('touchstart', (e) => {
        if (document.getElementById('fullscreenOverlay').classList.contains('active')) return;   //  Don't swipe if an image is in fullscreen
        if (e.target.closest('.gallery-container')) {
          touchStartX = e.touches[0].clientX;
        }
      });

      document.addEventListener('touchend', (e) => {
          if (document.getElementById('fullscreenOverlay').classList.contains('active')) return;   // Don't swipe if an image is in fullscreen
        if (e.target.closest('.gallery-container')) {
          const touchEndX = e.changedTouches[0].clientX;
          const diff = touchStartX - touchEndX;

          if (diff > 50) nextSlide();
          else if (diff < -50) prevSlide();
        }
      });

      // Close modal on background click
      document.getElementById('projectModal').addEventListener('click', (e) => {
        if (e.target.id === 'projectModal') closeModal();
      });

      // Initialize
      window.addEventListener('load', generateGrid);
  </script>
</body>

</html>
